spring.application.name=alerte-disparition
server.port=8081

# --- Base de donnees ---
# Dev : H2 en fichier (aucune installation). La console est sur /h2-console
spring.datasource.url=jdbc:h2:file:./data/alerte;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# Pour passer sur MySQL (Laragon), commenter le bloc H2 et decommenter :
#spring.datasource.url=jdbc:mysql://localhost:3306/alerte_disparition?createDatabaseIfNotExist=true
#spring.datasource.username=root
#spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

# --- Fichiers ---
app.uploads=./uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
