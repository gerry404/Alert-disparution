spring.application.name=alerte-disparition
server.port=8081

# Profil par defaut : dev (MySQL local + donnees de demo).
spring.profiles.default=dev

# --- JPA / Flyway : le schema vient UNIQUEMENT des migrations ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration

# --- Fichiers ---
app.uploads=${APP_UPLOADS:./uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# --- Regles applicatives ---
app.securite.duree-session=P30D
app.limites.temoignages-par-heure=5
app.limites.inscriptions-par-heure=30
app.limites.echecs-connexion=8
app.rapprochement.seuil=50
app.notifications.journal=true

# Derriere un proxy (nginx...), la vraie IP client est dans X-Forwarded-For
server.forward-headers-strategy=native

# Erreurs : pas de stack trace dans les reponses
server.error.include-stacktrace=never
